#This is only an example. Most values are dummy placeholders just to match the
#types; they are often not optimal and must be tuned. 

[control]
version = 4
online = false

#The values retained from Mortal original repository are preserved as-is 
#and do not necessarily imply suitability for Mortal-Policy repository

state_file = '/path/to/mortal.pth'
best_state_file = '/path/to/best.pth'
tensorboard_dir = '/path/to/dir'

device = 'cuda:0'
enable_cudnn_benchmark = true
enable_amp = false
enable_compile = false
allow_tf32 = true
enable_cuda_prefetch = true

batch_size = 512
opt_step_every = 1

save_every = 400
test_every = 20000
submit_every = 400
old_update_every = 400

# using env `TRAIN_PLAY_PROFILE`
[train_play.default]
games = 800
log_dir = '/path/to/train_play'
repeats = 1
#Using values between 0.0 and 1.0 is unconventional and may harm results,
#but it could stabilize optimization if other hyperparameters are poorly configured.
explore_rate = 1.0


[test_play]
enable = false
games = 3000
initial_enable = false
initial_games = 600
log_dir = '/path/to/test_play'

[repro]
enabled = false
seed = 20260415
strict_cuda = false
allow_cudnn_benchmark = false
# Optional fixed online self-play key. If omitted, it is derived from [repro].seed.
# train_key = 123456789
# Optional fixed start seed for online self-play batches.
# train_seed_start = 10000

[supervised]
state_file = '/path/to/sl_latest.pth'
best_state_file = '/path/to/sl_canonical.pth'
best_loss_state_file = '/path/to/sl_canonical.pth'
best_acc_state_file = '/path/to/sl_best_acc.pth'
best_rank_state_file = '/path/to/sl_best_rank.pth'
init_state_file = '/path/to/optional_init_only_checkpoint.pth'
tensorboard_dir = '/path/to/tb_log_supervised_main'
file_index = '/path/to/file_index_supervised_json.pth'
batch_size = 1024
save_every = 2000
num_workers = 4
file_batch_size = 10
val_file_batch_size = 8
prefetch_factor = 3
val_prefetch_factor = 5
log_every = 500
max_epochs = 99
max_steps = 60000
min_epochs = 2
val_every_steps = 10000
monitor_val_batches = 1024
full_val_every_checks = 0
old_regression_every_checks = 0
force_safe_training = false
min_validation_checks = 2
early_stopping_patience = 8
early_stopping_patience_checks = 8
early_stopping_min_delta = 0.0005
early_stopping_min_lr_reductions = 2
val_ratio = 0.02
min_val_files = 64
max_train_files = 0
max_val_files = 0
seed = 20260308

[supervised.scheduler]
type = 'plateau' # plateau | cosine
warm_up_steps = 5000
init = 1e-8
factor = 0.5
patience = 2
threshold = 0.0005
cooldown = 0
min_lr = 1e-6
final = 1e-5
max_steps = 0

[supervised.gradient_calibration]
enabled = true
split = 'full_recent'
max_batches = 8

[supervised.rank_aux]
base_weight = 0.03
south_factor = 1.59
all_last_factor = 1.617
gap_focus_points = 4000
gap_close_bonus = 0.0
max_weight = 0.10

[supervised.rank_aux.turn_weighting]
early_factor = 1.00
mid_factor = 1.05
late_factor = 1.15
early_max_turn = 4
late_min_turn = 12

[dataset]
globs = ['/path/to/dataset_json/**/*.json']
file_index = '/path/to/file_index_json.pth'
file_batch_size = 15
reserve_ratio = 0.0
num_workers = 6
prefetch_factor = 4
player_names_files = []
num_epochs = 1
enable_augmentation = false
augmented_first = false

#Current local mainline encoder default is b40c192 with GroupNorm.
#This example keeps placeholder paths, but the architecture should match the
#current repository default unless an experiment explicitly overrides it.
[resnet]
conv_channels = 192
num_blocks = 40

[env]
pts = [6.0, 4.0, 2.0, 0.0]

[oracle_critic_pretrain]
run_name = 'oracle_critic_score_rank_mc_bridge'
state_file = '/path/to/oracle_critic_latest.pth'
best_state_file = '/path/to/oracle_critic_best.pth'
tensorboard_dir = '/path/to/tb_log_oracle_critic'
metrics_file = '/path/to/oracle_critic_metrics.jsonl'
file_index = '/path/to/file_index_oracle_critic_json.pth'
init_state_file = '/path/to/sl_canonical.pth'
target_mode = 'all_players'
return_mode = 'score_rank_mc'
discount_gamma = 0.999
train_scope = 'oracle_input_value'
batch_size = 512
num_workers = 4
val_num_workers = 0
file_batch_size = 10
val_file_batch_size = 8
prefetch_factor = 3
val_prefetch_factor = 5
log_every = 100
save_every = 1000
val_every_steps = 2000
val_batches = 256
max_steps = 100000
val_ratio = 0.02
min_val_files = 64
max_val_files = 512
max_train_files = 0
num_epochs = 1
seed = 20260416
zero_sum_weight = 0.01

[oracle_critic_pretrain.scheduler]
peak = 5e-5
final = 1e-5
warm_up_steps = 2000
max_steps = 100000
init = 1e-8

## These hyperparameters are merely the default values and do not imply that they are optimal.
[policy]
awr_beta = 1.0
awr_clip = 100
entropy_weight = 1e-3
clip_ratio = 0.2
dual_clip  = 3.0
online_action_scope = 'all'
logit_thres = 0.0
importance_rho_clip = 0.0
importance_c_clip = 0.0
entropy_floor = 0.0
entropy_floor_start_step = 0
entropy_target = 0.0   # legacy alias for entropy_floor
entropy_adjust_rate = 0.0

[aux]
next_rank_weight = 0.2
opponent_state_weight = 0.0
opponent_shanten_weight = 0.8506568408072642
opponent_tenpai_weight = 1.1493431591927359
danger_enabled = false
danger_weight = 0.0
danger_any_weight = 0.09042179466099699
danger_value_weight = 0.8180402859274302
danger_player_weight = 0.09153791941157279
danger_focal_gamma = 0.0
danger_ramp_steps = 0
danger_value_cap = 96000.0

[aux.opponent_turn_weighting]
early_factor = 0.20
mid_factor = 1.0
late_factor = 1.60
early_max_turn = 4
late_min_turn = 12

[aux.danger_turn_weighting]
early_factor = 0.05
mid_factor = 1.0
late_factor = 2.50
early_max_turn = 4
late_min_turn = 12

[optim]
eps = 1e-8
betas = [0.9, 0.999]
weight_decay = 0.1
max_grad_norm = 0

[optim.scheduler]
peak = 1e-4
final = 1e-4
warm_up_steps = 0
max_steps = 0

[baseline.train]
device = 'cuda:0'
enable_compile = false
state_file = '/path/to/baseline.pth'
champion_state_file = '/path/to/baseline_current_champion.pth'
anchor_state_file = '/path/to/baseline_stable_anchor.pth'
history_state_files = []
champion_prob = 0.50
anchor_prob = 0.25
history_prob = 0.25
reload_each_session = true
# Optional deterministic sampling seed for reproducible smoke runs.
# pool_seed = 20260414

[baseline.train_presets.validation]
device = 'cuda:0'
enable_compile = false
state_file = './checkpoints/opponent_pool/baseline_anchor_legacy.pth'
champion_state_file = './checkpoints/opponent_pool/sl_canonical_supervised_champion.pth'
anchor_state_file = './checkpoints/opponent_pool/baseline_anchor_legacy.pth'
history_state_files = ['./checkpoints/opponent_pool/rl1_aux_only_500_20260415_best.pth']
champion_prob = 0.20
anchor_prob = 0.70
history_prob = 0.10
reload_each_session = true

[baseline.train_presets.formal]
device = 'cuda:0'
enable_compile = false
state_file = './checkpoints/opponent_pool/baseline_anchor_legacy.pth'
champion_state_file = './checkpoints/opponent_pool/rl1_vgi_500_validation_20260416_best.pth'
anchor_state_file = './checkpoints/opponent_pool/baseline_anchor_legacy.pth'
history_state_files = [
  './checkpoints/opponent_pool/sl_canonical_supervised_champion.pth',
  './checkpoints/opponent_pool/rl1_aux_only_500_20260415_best.pth',
  './checkpoints/opponent_pool/rl1_mortal_policy_smoke_4k_20260411_best.pth',
]
champion_prob = 0.50
anchor_prob = 0.25
history_prob = 0.25
reload_each_session = true

[baseline.test]
device = 'cuda:0'
enable_compile = false
state_file = '/path/to/baseline.pth'

[value]
enabled = true
weight = 0.05
# auto: Oracle critic -> all_players, visible critic -> current_player
target_mode = 'auto'
# auto default in code: Oracle critic -> score_rank, visible critic -> grp
reward_source = 'score_rank'
zero_sum_weight = 0.01
oracle_critic = true
oracle_critic_state_file = '/path/to/oracle_critic_best.pth'

[oracle_guiding]
actor_enabled = false
actor_source = 'true'
schedule = 'linear'
gamma_start = 1.0
gamma_end = 0.0
hold_steps = 0
decay_steps = 200000
continuation_lr_scale = 0.1
importance_weight_threshold = 4.0

[oracle_experiments]
default_arm = 'current_config'
suffix_artifacts = true

[oracle_dependency_eval]
enabled = false
modes = ['true', 'zero', 'shuffled']
log_dir = './logs/oracle_dependency'

[search]
enabled = true
top_k = 5
belief_samples = 8
planner_blend = 0.65
score_temperature = 0.85
min_policy_entropy = 1.15
min_margin = 0.08
min_opp_tenpai_prob = 0.30
min_danger_prob = 0.22
risk_weight = 1.30
variance_weight = 0.35
tile_eff_weight = 0.20
hand_value_weight = 0.18
call_regret_weight = 0.22
riichi_bonus = 0.06
agari_bonus = 0.60
pass_bonus = 0.05
safe_discard_bias = 0.08
hard_entropy_min = 1.05
hard_margin_max = 0.06
hard_danger_min = 0.28

[search_distill]
enabled = true
weight = 0.03
hard_only = true
min_teacher_gap = 0.03

[online]
history_window = 50
enable_compile = false
init_state_file = '/path/to/sl_canonical.pth'
stop_at_max_steps = true

[online.importance_sampling]
enabled = true
max_policy_versions = 8
drop_untracked_samples = false
vtrace_mode = 'auto'
vtrace_min_version_gap = 2

[online.remote]
host = '127.0.0.1'
port = 5000

[online.server]
buffer_dir = '/path/to/buffer'
drain_dir = '/path/to/drain'
sample_reuse_rate = 0
sample_reuse_threshold = 0
capacity = 1600
force_sequential = false

[1v3]
seed_key = -1
games_per_iter = 2000
# Optional: set seed_count directly instead of games_per_iter / 4.
# seed_count = 500
# Optional: split a single 1v3 iteration across multiple local shard workers.
# shard_count = 2
iters = 500
log_dir = '/path/to/1v3'

# Optional per-machine / per-GPU overrides. `one_vs_three.py` resolves in this order:
#   MORTAL_1V3_SEED_COUNT env
#   [1v3.machine_overrides.<COMPUTERNAME>]
#   [1v3.gpu_overrides."<GPU name>"]
#   built-in local GPU defaults
#   [1v3].seed_count or [1v3].games_per_iter
#
# Current built-in GPU defaults verified on 2026-04-02:
#   RTX 5070 Ti -> seed_count = 1024, shard_count = 4
#   RTX 4060 Laptop GPU -> seed_count = 640, shard_count = 3
#
# [1v3.machine_overrides.YOUR_HOSTNAME]
# seed_count = 1024
# shard_count = 4
#
# [1v3.gpu_overrides."NVIDIA GeForce RTX 4060 Laptop GPU"]
# seed_count = 640
# shard_count = 3

[1v3.challenger]
device = 'cuda:0'
name = 'mortal'
state_file = '/path/to/challenger.pth'
stochastic_latent = false
enable_compile = false
enable_amp = true
enable_rule_based_agari_guard = true

[1v3.champion]
device = 'cuda:0'
name = 'baseline'
state_file = '/path/to/baseline.pth'
stochastic_latent = false
enable_compile = false
enable_amp = true
enable_rule_based_agari_guard = true

[grp]
state_file = '/path/to/grp.pth'
latest_state_file = '/path/to/grp_latest.pth'
best_loss_state_file = '/path/to/grp.pth'
best_acc_state_file = '/path/to/grp_best_acc.pth'

[grp.network]
hidden_size = 384
num_layers = 3
dtype = 'float32'

[grp.control]
device = 'cuda:0'
enable_cudnn_benchmark = true
allow_tf32 = false
tensorboard_dir = 'grp_v2/log'

batch_size = 1024
save_every = 2000
val_steps = 0
max_epochs = 30
min_epochs = 8
early_stopping_patience = 8
early_stopping_min_delta = 0.0005
early_stopping_min_lr_reductions = 2

[grp.dataset]
train_globs = [
    '/path/to/dataset/2019/**/*.json.gz',
    '/path/to/dataset/2020/**/*.json.gz',
    '/path/to/dataset/2021/01/**/*.json.gz',
    '/path/to/dataset/2021/02/**/*.json.gz',
    # ...
]
val_globs = [
    '/path/to/dataset/2021/10/**/*.json.gz',
    '/path/to/dataset/2021/11/**/*.json.gz',
    # ...
]
file_index = '/path/to/grp_file_index.pth'
file_batch_size = 50
num_workers = 10
prefetch_factor = 4

[grp.optim]
lr = 2e-5

[grp.optim.scheduler]
factor = 0.5
patience = 2
threshold = 0.0005
cooldown = 1
min_lr = 1e-6
